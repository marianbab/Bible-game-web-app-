
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoraď biblické knihy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #102a43;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 28px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(16, 42, 67, 0.08);
            text-align: center;
        }

        .score-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: #486581;
            background: #f8fafc;
            padding: 8px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 1.35rem;
            line-height: 1.4;
            margin-bottom: 20px;
            color: #102a43;
        }

        .books-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .book-btn {
            background-color: #ffffff;
            color: #102a43;
            border: 2px solid #d9e2ec;
            border-radius: 10px;
            padding: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .book-btn:hover:not(:disabled) {
            background-color: #f0f4f8;
            border-color: #829ab1;
            transform: translateY(-1px);
        }

        .book-btn:disabled {
            background-color: #e2e8f0;
            color: #94a3b8;
            border-color: #cbd5e1;
            cursor: default;
        }

        .selection-box {
            min-height: 54px;
            background-color: #f8fafc;
            border: 1px dashed #bcccdc;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.98rem;
            color: #334e68;
            font-weight: 600;
            line-height: 1.4;
        }

        .feedback {
            display: none;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-weight: 600;
            line-height: 1.4;
        }

        .feedback.success {
            display: block;
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .feedback.error {
            display: block;
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .ctrl-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .ctrl-btn:hover {
            opacity: 0.9;
        }

        .btn-reset {
            background-color: #ffc9c9;
            color: #7f1d1d;
        }

        .btn-new {
            background-color: #bae6fd;
            color: #0c4a6e;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="score-bar">
        <span>Správne: <strong id="score-correct">0</strong></span>
        <span>Kolá: <strong id="score-total">0</strong></span>
    </div>

    <h1>Klikaj na knihy v poradí,<br>v akom nasledujú v Biblii:</h1>

    <div class="books-list" id="books-container"></div>

    <div class="selection-box" id="selection-display">
        Tvoje poradie:
    </div>

    <div class="feedback" id="feedback-box"></div>

    <div class="controls">
        <button class="ctrl-btn btn-reset" onclick="resetSelection()">Vymazať výber</button>
        <button class="ctrl-btn btn-new" onclick="startNewGame()">Nové knihy</button>
    </div>
</div>

<script>
    const BIBLICKE_KNIHY = [
        '1. Mojžišova', '2. Mojžišova', '3. Mojžišova', '4. Mojžišova', '5. Mojžišova', 'Jozua', 'Sudcovia', 'Rút', 
        '1. Samuelova', '2. Samuelova', '1. Kráľov', '2. Kráľov', '1. Kroník', '2. Kroník', 'Ezdráš', 'Nehemiáš', 
        'Ester', 'Jób', 'Žalmy', 'Príslovia', 'Kazateľ', 'Šalamúnova pieseň', 'Izaiáš', 'Jeremiáš', 'Plač Jeremiáša', 'Ezechiel', 
        'Daniel', 'Ozeáš', 'Joel', 'Amos', 'Abdiáš', 'Jonáš', 'Micheáš', 'Náhum', 'Habakuk', 'Sofoniáš', 
        'Ageus', 'Zachariáš', 'Malachiáš', 'Matúš', 'Marek', 'Lukáš', 'Ján', 'Skutky apoštolov', 'Rimanom', '1. Korinťanom', 
        '2. Koroniťanom', 'Galaťanom', 'Efezanom', 'Filipanom', 'Kolosanom', '1. Tesaloničanom', '2. Tesaloničanom', '1. Timotejovi', '2. Timotejovi', 
        'Títovi', 'Filemónovi', 'Hebrejom', 'Jakub', '1. Petra', '2. Petra', '1. Jána', '2. Jána', '3. Jána', 
        'Júda', 'Zjavenie'
    ];

    let currentBooks = [];
    let correctOrder = [];
    let userOrder = [];
    let correctCount = 0;
    let totalRounds = 0;
    let roundFinished = false;

    function getRandomBooks(count) {
        const shuffled = [...BIBLICKE_KNIHY].sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
    }

    function startNewGame() {
        currentBooks = getRandomBooks(5);
        correctOrder = BIBLICKE_KNIHY.filter(book => currentBooks.includes(book));
        resetSelection();
        renderButtons();
    }

    function renderButtons() {
        const container = document.getElementById('books-container');
        container.innerHTML = '';

        currentBooks.forEach((book, index) => {
            const btn = document.createElement('button');
            btn.className = 'book-btn';
            btn.textContent = book;
            btn.id = `book-btn-${index}`;
            btn.onclick = () => selectBook(book, btn);
            container.appendChild(btn);
        });
    }

    function resetSelection() {
        userOrder = [];
        roundFinished = false;
        document.getElementById('selection-display').textContent = 'Tvoje poradie: ';
        
        const feedback = document.getElementById('feedback-box');
        feedback.className = 'feedback';
        feedback.innerHTML = '';

        const buttons = document.querySelectorAll('.book-btn');
        buttons.forEach(btn => btn.disabled = false);
    }

    function selectBook(book, btnElement) {
        if (roundFinished) return;

        btnElement.disabled = true;
        userOrder.push(book);

        document.getElementById('selection-display').textContent = 
            'Tvoje poradie: ' + userOrder.join(' ➔ ');

        if (userOrder.length === 5) {
            evaluateGame();
        }
    }

    function evaluateGame() {
        roundFinished = true;
        totalRounds++;
        const isCorrect = JSON.stringify(userOrder) === JSON.stringify(correctOrder);
        const feedback = document.getElementById('feedback-box');

        if (isCorrect) {
            correctCount++;
            feedback.className = 'feedback success';
            feedback.innerHTML = 'Výborne! Zoradil(a) si knihy úplne presne.';
        } else {
            feedback.className = 'feedback error';
            feedback.innerHTML = `Žiaľ, nebolo to správne.<br>Správne poradie: <strong>${correctOrder.join(' ➔ ')}</strong>`;
        }

        document.getElementById('score-correct').textContent = correctCount;
        document.getElementById('score-total').textContent = totalRounds;
    }

    // Spustenie prvého kola po načítaní stránky
    startNewGame();
</script>

</body>
</html>
